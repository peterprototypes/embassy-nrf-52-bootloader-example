[package]
name = "example-nrf52-app"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { version = "1.0.1" }
defmt-rtt = { version = "1.0.0" }
panic-reset = { version = "0.1.1" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-hal = { version = "1.0.0" }
embedded-storage = "0.3.1"
heapless = "0.8"

cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"

embassy-boot-nrf = { version = "0.10.0", features = ["softdevice"] }
embassy-boot = "0.6.1"
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.5.0"

embassy-nrf = { version = "0.9.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "time",
] }

embassy-executor = { version = "0.9", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }

embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

nrf-softdevice = { version = "0.1.0", features = [
    "nrf52840",
    "s140",
    "defmt",
    "ble-peripheral",
    "ble-gatt-server",
    "critical-section-impl",
] }

[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }
embassy-boot = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "dff15aeb5fb5b206684dd673f6c48cd77e2548c7" }

# Use master branch of nrf-softdevice which is compatible with newer embassy
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "5949a5b1445cc907745c6449a35577e4544cd255" }
nrf-softdevice-s140 = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "5949a5b1445cc907745c6449a35577e4544cd255" }
